name: Bug or counting discrepancy
description: Report a reproducible CLI, counting, selection, or report problem.
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the expected result and the observed result.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CCM version and operating system
      placeholder: ccm 1.0.0-beta.3, FreeBSD 15.1 x86-64
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: Include selection options and the count-policy version from JSON when relevant.
      render: text
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Small source example or reproduction steps
      description: Include expected code, comment, and blank-line counts for a counting discrepancy.
    validations:
      required: true
