<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img"><title>CCM architecture</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#79529d"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#fffcfa"/><g font-family="DejaVu Sans,sans-serif" fill="#302638"><text x="40" y="35" font-size="20" font-weight="700">Four crates. Dependencies point downward.</text><rect x="185" y="58" width="565" height="68" rx="10" fill="#fbe4f0" stroke="#cdbad9"/><text x="203" y="85" font-size="19" font-weight="700">cmd/ccm</text><text x="203" y="108" font-size="15" font-weight="400">Arguments, report bundle, terminal / HTML / JSON</text><path d="M470 126L470 150" fill="none" stroke="#79529d" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="none"/><rect x="185" y="152" width="565" height="68" rx="10" fill="#eee4fa" stroke="#cdbad9"/><text x="203" y="179" font-size="19" font-weight="700">ccm-project</text><text x="203" y="202" font-size="15" font-weight="400">Selection, bounded workers, snapshots, byte comparison</text><path d="M470 220L470 244" fill="none" stroke="#79529d" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="none"/><rect x="185" y="246" width="565" height="68" rx="10" fill="#fbe9db" stroke="#cdbad9"/><text x="203" y="273" font-size="19" font-weight="700">ccm-scan</text><text x="203" y="296" font-size="15" font-weight="400">Native lexers, mixed documents, declarative catalog</text><path d="M470 314L470 338" fill="none" stroke="#79529d" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="none"/><rect x="185" y="340" width="565" height="68" rx="10" fill="#f1eafa" stroke="#cdbad9"/><text x="203" y="367" font-size="19" font-weight="700">ccm-core</text><text x="203" y="390" font-size="15" font-weight="400">Counts, errors, finite models, evidence, resource prices</text><text x="40" y="441" font-size="13" font-weight="400">The CLI and project adapter also use ccm-core directly. The core never reads files.</text></g></svg>
