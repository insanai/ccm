<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img"><title>CCM change</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#79529d"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#fffcfa"/><g font-family="DejaVu Sans,sans-serif" fill="#302638"><text x="35" y="38" font-size="22" font-weight="700">Two edit seeds. Three affected parts.</text><rect x="40" y="95" width="220" height="68" rx="10" fill="#fbe0ef" stroke="#cdbad9"/><text x="58" y="122" font-size="19" font-weight="700">pricing.rs</text><text x="58" y="145" font-size="15" font-weight="400">changed seed</text><rect x="40" y="260" width="220" height="68" rx="10" fill="#fbe0ef" stroke="#cdbad9"/><text x="58" y="287" font-size="19" font-weight="700">inventory.rs</text><text x="58" y="310" font-size="15" font-weight="400">changed seed</text><rect x="350" y="177" width="230" height="68" rx="10" fill="#e8ddf6" stroke="#cdbad9"/><text x="368" y="204" font-size="19" font-weight="700">checkout.rs</text><text x="368" y="227" font-size="15" font-weight="400">dependent / review scope</text><rect x="660" y="177" width="200" height="68" rx="10" fill="#ffecd9" stroke="#cdbad9"/><text x="678" y="204" font-size="19" font-weight="700">payment.rs</text><text x="678" y="227" font-size="15" font-weight="400">unchanged boundary</text><path d="M260 129L350 201" fill="none" stroke="#79529d" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="none"/><path d="M260 294L350 221" fill="none" stroke="#79529d" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="none"/><text x="360" y="282" font-size="13" font-weight="400">Affected does not mean rewritten.</text><text x="635" y="282" font-size="13" font-weight="400">No dependency edge is declared.</text><text x="40" y="391" font-size="16" font-weight="700">Pricing and checkout evidence is invalidated. Payment evidence survives.</text><text x="40" y="420" font-size="14" font-weight="400">Required check units: 7. Remaining check units: 6. Shared: 1. Additional joint: 3.</text></g></svg>
