<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="ccm-logo-title ccm-logo-desc">
<title id="ccm-logo-title">CCM mark</title>
<desc id="ccm-logo-desc">An isometric cube whose near corner is cut away. A small bright cube sits in the inner corner of the cut. Seen along the diagonal, the solid forms three nested hexagons: a change at the center, contained by the layers around it.</desc>
