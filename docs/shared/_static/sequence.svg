<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img"><title>CCM sequence</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#79529d"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#fffcfa"/><g font-family="DejaVu Sans,sans-serif" fill="#302638"><text x="35" y="32" font-size="20" font-weight="700">One invocation, from options to a report</text><path d="M80 95V610" stroke="#d5cadf" stroke-dasharray="4 5"/><rect x="15" y="54" width="130" height="68" rx="10" fill="#f2eafa" stroke="#cdbad9"/><text x="33" y="81" font-size="19" font-weight="700">CLI</text><text x="33" y="104" font-size="15" font-weight="400"></text><path d="M270 95V610" stroke="#d5cadf" stroke-dasharray="4 5"/><rect x="205" y="54" width="130" height="68" rx="10" fill="#f2eafa" stroke="#cdbad9"/><text x="223" y="81" font-size="19" font-weight="700">Project</text><text x="223" y="104" font-size="15" font-weight="400"></text><path d="M460 95V610" stroke="#d5cadf" stroke-dasharray="4 5"/><rect x="395" y="54" width="130" height="68" rx="10" fill="#f2eafa" stroke="#cdbad9"/><text x="413" y="81" font-size="19" font-weight="700">Workers</text><text x="413" y="104" font-size="15" font-weight="400"></text><path d="M650 95V610" stroke="#d5cadf" stroke-dasharray="4 5"/><rect x="585" y="54" width="130" height="68" rx="10" fill="#f2eafa" stroke="#cdbad9"/><text x="603" y="81" font-size="19" font-weight="700">Finite core</text><text x="603" y="104" font-size="15" font-weight="400"></text><path d="M840 95V610" stroke="#d5cadf" stroke-dasharray="4 5"/><rect x="775" y="54" width="130" height="68" rx="10" fill="#f2eafa" stroke="#cdbad9"/><text x="793" y="81" font-size="19" font-weight="700">Renderer</text><text x="793" y="104" font-size="15" font-weight="400"></text><path d="M80 155L270 155" fill="none" stroke="#79529d" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="none"/><text x="90" y="145" font-size="16" font-weight="400">select paths and limits</text><path d="M270 210L460 210" fill="none" stroke="#79529d" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="none"/><text x="280" y="200" font-size="16" font-weight="400">bounded file queue</text><path d="M460 265L270 265" fill="none" stroke="#79529d" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="280" y="255" font-size="16" font-weight="400">counts + diagnostics</text><path d="M270 320L80 320" fill="none" stroke="#79529d" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="90" y="310" font-size="16" font-weight="400">stable source inventory</text><path d="M80 375L650 375" fill="none" stroke="#79529d" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="none"/><text x="90" y="365" font-size="16" font-weight="400">model + change seeds</text><path d="M650 430L80 430" fill="none" stroke="#79529d" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="90" y="420" font-size="16" font-weight="400">closure, checks, evidence</text><path d="M80 485L840 485" fill="none" stroke="#79529d" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="none"/><text x="90" y="475" font-size="16" font-weight="400">bundle + explicit prices</text><path d="M840 555L80 555" fill="none" stroke="#79529d" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="90" y="545" font-size="16" font-weight="400">bounded complete report</text><text x="35" y="630" font-size="13" font-weight="400">Selection overlaps workers. The core evaluates evidence; no checker runs.</text></g></svg>
