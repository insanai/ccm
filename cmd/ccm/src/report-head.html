<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>CCM | Source &amp; change intelligence</title>
<style>
:root { color-scheme:light dark; --bg:#fff9f5; --ink:#32263e; --muted:#75637c;
  --panel:#fff; --line:#eadfec; --accent:#7846ad; --pink:#ec79ad; --orange:#f5a166; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.6 system-ui,sans-serif; }
header,main,footer { max-width:1120px; margin:auto; padding:32px; }
header { padding-top:36px; }
.brand-mark { width:160px; height:90px; margin-left:-16px; }
.brand-mark svg { width:100%; height:100%; }
h1 { font-size:clamp(2rem,5vw,3.5rem); letter-spacing:-.05em; line-height:1.1; }
h2 { font-size:1.25rem; margin:0 0 16px; }
h3 { font-size:1rem; }
p { color:var(--muted); }
.eyebrow { font-size:.75rem; font-weight:750; letter-spacing:.18em; color:var(--accent); }
section { padding:28px; margin-bottom:24px; background:var(--panel);
  border:1px solid var(--line); border-radius:16px; }
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:20px;
  background:none; border:0; padding:0; }
.metric { border-top:3px solid var(--accent); background:var(--panel);
  border-radius:12px; padding:24px; box-shadow:0 6px 20px #57336208; }
.metric:nth-child(1) { border-top-color:var(--pink); }
.metric:nth-child(3) { border-top-color:var(--orange); }
.metric span { display:block; color:var(--muted); font-size:.85rem; }
.metric strong { display:block; font-size:clamp(1.4rem,3vw,2rem); margin-top:10px; }
.scroll { overflow-x:auto; }
table { border-collapse:collapse; width:100%; font-size:.9rem; }
th,td { border-bottom:1px solid var(--line); padding:12px; text-align:right; }
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2) { text-align:left; }
td:first-child { overflow-wrap:anywhere; }
th { font-size:.75rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
li { margin:10px 0; overflow-wrap:anywhere; }
.badge { font-size:.75rem; border:1px solid var(--line); border-radius:6px;
  padding:3px 8px; color:var(--accent); }
pre { white-space:pre-wrap; overflow-wrap:anywhere; font-size:.85rem; line-height:1.6; }
summary { cursor:pointer; color:var(--accent); padding:16px 0; }
.warning { border-left:3px solid #bc7617; padding-left:16px; }
footer { font-size:.8rem; color:var(--muted); }
@media(max-width:650px) { .metrics { grid-template-columns:1fr; }
  header,main,footer { padding:20px; } section { padding:20px; } }
@media(prefers-color-scheme:dark) { :root { --bg:#211827; --ink:#f5edf8;
  --muted:#c7b7ce; --panel:#2c2134; --line:#4a3654; --accent:#d1adfa; } }
@media print { :root { color-scheme:light; } body { background:white; }
  section { break-inside:avoid; } header { padding-top:0; } }
</style></head><body>
