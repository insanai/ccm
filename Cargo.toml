[workspace]
members = ["crates/*", "cmd/ccm", "tools/xtask", "tools/ccm-art"]
default-members = ["cmd/ccm"]
resolver = "3"

[workspace.package]
version = "1.0.0-beta.2"
edition = "2024"
license = "LGPL-3.0-or-later"
authors = ["Vikrant Rathore"]
rust-version = "1.85"
repository = "https://github.com/insanai/ccm"
homepage = "https://insanai.github.io/ccm/"

[workspace.dependencies]
ccm-core = { path = "crates/ccm-core" }
ccm-scan = { path = "crates/ccm-scan" }
ccm-project = { path = "crates/ccm-project" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
